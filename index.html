<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Fa 2.0 — A/C clickable UX wireframes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="prototype-bar" aria-label="Prototype controls">
    <span class="prototype-label">Fa 2.0 / UX wireframes</span>
    <div class="prototype-group" aria-label="UX concept">
      <button type="button" data-prototype="variant" data-value="a">A · Messenger</button>
      <button type="button" data-prototype="variant" data-value="c">C · Pulse</button>
    </div>
    <span class="prototype-spacer"></span>
    <div class="prototype-group" aria-label="Viewport preview">
      <button type="button" data-prototype="viewport" data-value="desktop">Desktop</button>
      <button type="button" data-prototype="viewport" data-value="mobile">Mobile</button>
      <button type="button" data-prototype="viewport" data-value="fold">Fold</button>
      <button type="button" data-prototype="keyboard" aria-pressed="false" title="Preview the mobile screen keyboard">Keyboard</button>
      <button type="button" data-prototype="empty" aria-pressed="false" title="Preview first-run empty states without deleting demo data">Empty</button>
    </div>
    <a class="prototype-link" href="styleguide.html" data-prototype-link="styleguide" title="Visual directions and design system">Styleguide</a>
    <a class="prototype-link" href="logos.html" data-prototype-link="logos" title="Brand identity and logo lab">Logos</a>
  </header>

  <div id="frame" class="frame">
    <div id="app"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>This clickable wireframe requires JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
